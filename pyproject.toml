[project]
name = "juena-rag"
version = "0.0.1"
description = "Chunk schema, storage and retrieval for the JCNS knowledge base"
readme = "README.md"
requires-python = ">=3.11, <4.0"
license = "MIT"
authors = [
    {name = "Ahmad Z. Ihsan", email = "a.ihsan@fz-juelich.de"}
]
keywords = ["rag", "vector-search", "pgvector", "neutron-scattering"]

# Deliberately minimal. Anyone writing an ingestion pipeline needs the schema
# and nothing else, so the database and web layers are extras.
dependencies = [
    "pydantic>=2.11.2,<3.0.0",
    # For `juena_rag.parsers`, which reads a source file's structure. Grammars
    # rather than pattern matching, because Fortran's two source layouts and
    # LaTeX's nesting both defeat regexes -- and 4.8 MB of compiled grammar is a
    # smaller cost than getting a citation's function name wrong.
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
# Talk to pgvector directly.
store = [
    "psycopg[binary,pool]==3.3.4",
    "pgvector>=0.3.6",
]
# Talk to the embedding model: send text to it, and count tokens the way it
# does. Its own extra rather than part of [store], because a store handed an
# embedder needs no HTTP stack of its own.
#
# `tokenizers` is Hugging Face's Rust tokenizer -- a few megabytes, no
# transformers and no PyTorch. Nothing in this package uses it; it is here for
# whoever writes the chunks, so they can size them against the model's ceiling
# instead of guessing.
embed = [
    "openai>=1.68.0",
    "tokenizers>=0.20",
]
# Talk to the service instead of to the database. This is what a *consumer*
# installs -- the schema and one HTTP client, with no psycopg, no pgvector and no
# openai anywhere near it, which is most of the reason the service exists.
client = [
    "httpx>=0.27",
]
# Run the HTTP service. It reaches the database and embeds the question
# server-side, so this pulls the other extras in rather than leaving a deployment
# to remember them -- `client` included, because the shared test suite runs both
# halves against each other.
serve = [
    "juena-rag[store,embed,client]",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
# Run `juena-rag ingest-repo`: clone a repository, chunk it with a code chunker and
# a text splitter, read the caller's YAML config, then embed and store. Pulls in
# `store` and `embed` because an ingest does both.
#
# Both chunkers are pinned exactly, and that is not caution. Left as `chonkie>=`,
# uv resolved a newer release that split the identical 170 jscatter files into
# 4,114 chunks instead of 3,293 -- 25% more, entirely in `.py`, which is the only
# extension that reaches chonkie at all. Nothing announced it and nothing failed:
# the corpus would just have been embedded along different boundaries, at 25% more
# cost, for a reason nobody could reconstruct afterwards.
#
# `langchain-text-splitters` is pinned on principle rather than on evidence --
# 1.1.1 and 1.1.2 produce byte-identical output here, which is how the difference
# above was traced to chonkie. It is pinned before it gets the chance to stop.
ingest = [
    "juena-rag[store,embed]",
    "chonkie[code]==1.6.1",
    "langchain-text-splitters==1.1.2",
    "pyyaml>=6.0",
]

[project.scripts]
juena-rag = "juena_rag.service.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    # So the Blablador client and the store are import-checked by the test run. A
    # dev group is not part of the published package, so the base install stays
    # pydantic-only.
    "openai>=1.68.0",
    "tokenizers>=0.20",
    "psycopg[binary,pool]==3.3.4",
    "pgvector>=0.3.6",
    # So `.env` is enough to run the tests that need a key or a database. Nothing
    # in the package itself reads a file; only the test run does.
    "python-dotenv>=1.0",
    # The service, so `tests/test_service.py` is import-checked by the test run and
    # `uv run juena-rag serve` works from a clone. `httpx` is what FastAPI's
    # TestClient is built on; it arrives as somebody else's dependency today, and a
    # test suite should not rest on that.
    "fastapi>=0.104.0",
    "httpx>=0.27",
    "uvicorn[standard]>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juena_rag"]

[tool.pytest.ini_options]
# The ingestion tests skip cleanly without the `[ingest]` extra (`uv run --extra
# ingest pytest` runs them), the same way the database tests skip without a
# database.
testpaths = ["tests"]
