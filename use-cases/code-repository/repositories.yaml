# An example config for `juena-rag ingest-repo`, with one repository.
#
#   juena-rag ingest-repo jscatter --config use-cases/code-repository/repositories.yaml
#
# juena-rag keeps no list of its own. The corpus JüNA searches is listed in
# juena-chatbot's `config/repositories.yaml`, and ingested from there with
# `./juena repos-ingest`; juena-lab keeps its own in `deploy/rag/repositories.yaml`.
# Each caller's file decides which files are indexed and how they are split.
# Until 2026-10-22 this file held all eight of JüNA's repositories as a second
# copy, and the two had drifted apart.
#
#   id             the source_id in the database -- change it and you have a second source
#   source.url     where to clone from
#   source.branch  which branch to track
#   include_globs  which files to index; `**/` means zero or more directories
#   exclude_globs  which to skip -- exclusions win over inclusions
#   max_file_bytes skip anything larger, in bytes
#   chunk_size     characters per chunk (not tokens) -- required, no default
#   chunk_overlap  characters repeated between neighbouring chunks -- required too
#   docs_paths     a file, or a directory prefix, whose chunks are marked is_doc
#
# 3000/400 is measured, not inherited. The chatbot's old index used 1500/200, and at
# that size the median Fortran subroutine does not fit in one chunk. Over 25 graded
# questions, 3000 retrieved better for both code (top-3 7/9 -> 8/9) and prose
# (top-3 13/16 -> 15/16). Past about 6000 the gain stops while chunks start
# covering several subroutines each -- one vector standing for several separate
# facts, which is the same argument the README makes against storing a table
# whole. Raising it also costs citation precision: a chunk spanning four sections
# can only honestly be labelled with their shared parent.

repositories:

  - id: jscatter
    name: jscatter
    description: "Python software for X-ray and neutron scattering analysis, fitting, and plotting."
    source:
      url: https://gitlab.com/biehl/jscatter.git
      branch: main
    include_globs:
      - "**/*.py"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.txt"
    exclude_globs:
      - "**/node_modules/**"
      - "**/.git/**"
      - "**/__pycache__/**"
      - "**/.venv/**"
      - "**/dist/**"
      - "**/build/**"
    max_file_bytes: 524288          # 512 kB
    chunk_size: 3000
    chunk_overlap: 400
    # Corrected against the actual repository. The chatbot's config said
    # `README.md` and `docs/`, and jscatter has neither -- its readme is
    # `README.rst` and its documentation is under `src/jscatter/doc/`. Nothing
    # failed there; every chunk simply came out `is_doc=False`, including all 29
    # `.rst` files of real documentation.
    docs_paths:
      - "README.rst"
      - "src/jscatter/doc/"
